services:
  - type: web
    name: guangyun
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: >-
      pip install .
      && python scripts/fetch_data.py
      && python scripts/import_sbgy.py
      && python scripts/validate_data.py
    startCommand: >-
      uvicorn guangyun.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: GUANGYUN_CORS_ORIGINS
        value: "*"
