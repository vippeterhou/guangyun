<!doctype html>
<html lang="zh-Hant">
  <head>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="按漢字查詢《校正宋本廣韻》的卷、韻、小韻、反切與釋義。">
    <title>廣韻查詢</title>
    <style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
    </style>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=2">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">校正宋本廣韻</p>
        <h1>廣韻查詢</h1>
        <p class="intro">輸入一個漢字，查詢其所在卷、韻、小韻、反切與原書釋義。</p>
      </header>

      <section class="search-panel" aria-labelledby="search-title">
        <h2 id="search-title" class="sr-only">查詢漢字</h2>
        <form id="search-form" class="search-form">
          <label for="character-input">漢字</label>
          <div class="search-row">
            <input
              id="character-input"
              name="character"
              type="text"
              autocomplete="off"
              placeholder="如：東"
              aria-describedby="search-hint"
              required
            >
            <button type="submit">查詢</button>
          </div>
          <p id="search-hint" class="hint">每次查詢一個漢字；多音字會返回全部條目。</p>
        </form>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="results" class="results" aria-live="polite"></section>

      <footer>
        <p>
          資料來源：
          <a href="https://github.com/cjkvi/cjkvi-dict" rel="noopener noreferrer">
            CJKVI Dictionary Database
          </a>
          · GPL-2.0；簡繁映射：Unicode Unihan · Unicode License V3
        </p>
        <p><a href="/docs">REST API 文件</a></p>
      </footer>
    </main>
    <script src="{{ url_for('static', path='/app.js') }}?v=2" defer></script>
  </body>
</html>
