[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guangyun"
version = "0.1.0"
description = "A searchable REST API and website for the CJKVI Songben Guangyun dataset."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
guangyun-import = "guangyun.importer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guangyun"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
